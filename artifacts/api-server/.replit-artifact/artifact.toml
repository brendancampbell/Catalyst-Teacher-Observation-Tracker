kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
# Migrations are applied here because production has no other path to them.
# scripts/post-merge.sh applies them in the Replit WORKSPACE, against the dev
# database; the deployed service has its own, and nothing was migrating it.
# The startup guard in lib/pending-migrations.ts then refused to boot,
# /api/healthz 500'd, and Cloud Run never promoted — which is how this surfaced.
#
# Three steps, in the same order post-merge runs them, for the same reasons:
#
#   build      compile first, so a broken build never reaches the database.
#
#   backfill   production's schema was created by `drizzle-kit push`, which
#              never writes the tracking table. Without this, `migrate` starts
#              at 0000 and dies on `type "department_enum" already exists`
#              (PG 42710) — exactly what the first attempt did. The script
#              marks an explicit allowlist of 0000-0007 as applied and
#              deliberately excludes anything newer, so 0008 and 0009 are
#              still applied normally rather than skipped.
#
#   migrate    the SAME drizzle-kit command post-merge uses. One
#              implementation, so the two environments cannot drift.
#              drizzle-kit is a regular dependency of lib/db so it ships to
#              production, and drizzle.config.ts throws when DATABASE_URL is
#              missing rather than skipping quietly. Re-running is safe:
#              drizzle records each migration by content hash.
#
#   verify     the reason the baseline above is trustworthy at all. It marks
#              migrations applied on the evidence of a collision, which asserts
#              more than it proves — 0009 was baselined from ONE of its
#              eighteen CREATE INDEX statements. check:schema-sync compares
#              every declared table, column, type, nullability and index
#              against the live database, so a baseline that was wrong fails
#              the deploy here instead of shipping a schema quietly missing
#              constraints. It reports nothing it cannot map with certainty:
#              a gate that cries wolf gets deleted.
build = ["sh", "-c", "pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/db exec tsx src/backfill-drizzle-migrations-table.ts && pnpm --filter @workspace/db run migrate && pnpm --filter @workspace/db run check:schema-sync"]
run = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
