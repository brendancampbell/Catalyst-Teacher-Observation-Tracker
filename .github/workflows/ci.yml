# Runs the tests on every push and every pull request.
#
# Backlog #12. Nothing ran the full suite except somebody remembering to, and
# the tests that need a database could only be run where there was one — in
# practice by hand, with the results read back. Between a change being pushed
# and the app being published, the only check was that a person thought to make
# it.
#
# No new tests are written here and nothing about how they work changes. This
# runs what already exists.
#
# ── Two jobs, side by side ────────────────────────────────────────────────
# These used to be one job in fastest-fails-first order, so a typo would not
# wait behind a Postgres boot to be reported. That was the right shape for one
# job, but it meant the integration tier — five or six minutes of the run —
# did not START until the typecheck and unit tests had finished.
#
# They are now two jobs that run at the same time. A typo still surfaces in
# about three minutes, because "static" is not queued behind anything, and the
# database tier begins immediately rather than three minutes in.
#
# The two are genuinely independent: every workspace library exports its
# TypeScript source directly (see the "exports" field in lib/*/package.json),
# so nothing the database job runs needs the typecheck job to have built
# anything first. Both install their own dependencies — duplicated work, but
# it happens in parallel and the cache makes it cheap.
#
# ── Skipping a run ────────────────────────────────────────────────────────
# Documentation-only pushes are filtered out below and cost nothing.
#
# For anything else you judge too small to test, GitHub honours a marker in
# the commit message — put [skip ci] anywhere in it and the push runs nothing:
#
#     git commit -m "Nudge the header colour [skip ci]"
#
# Worth being sparing with. The changes that look too small to break something
# are the ones nobody checks locally either, and a skipped run is a run that
# cannot tell you which commit was at fault later.

name: CI

on:
  push:
    branches: [main]
    # Prose and the backlog carry no code. Editing BACKLOG.html used to stand
    # up a PostgreSQL database to prove that a static page still parsed.
    #
    # This skips a push only when EVERY changed file matches, so a commit
    # touching both a document and the app is still tested in full.
    paths-ignore:
      - '**.md'
      - 'BACKLOG.html'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'BACKLOG.html'
      - 'LICENSE'
      - '.gitignore'

# A second push supersedes the first — no point finishing a run for a commit
# nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Everything that needs no database ──────────────────────────────────
  # The fast half: type errors and ~420 unit checks, in a few minutes.
  static:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json, so this file does
      # not carry a second copy of it to fall out of date.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The api's own tier and both front-end suites, ~420 checks in well
      # under a minute.
      - name: Unit tests
        run: pnpm run test

  # ── Everything that needs one ──────────────────────────────────────────
  # The slow half, and the only place some of this can run at all: there is
  # no database on a developer machine by default.
  database:
    name: Database and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ubuntu-latest ships PostgreSQL but leaves its binaries off PATH, and
      # scripts/test-db.sh calls initdb and pg_ctl directly to stand up a
      # throwaway server of its own. This is the whole of the CI-specific setup.
      - name: Put PostgreSQL on PATH
        run: |
          set -euo pipefail
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$PGBIN" ]; then
            echo "No PostgreSQL found under /usr/lib/postgresql. What is here:"
            ls -la /usr/lib/postgresql 2>&1 || echo "  (the directory does not exist)"
            command -v initdb pg_ctl || echo "  initdb and pg_ctl are not on PATH either"
            exit 1
          fi
          echo "Using $PGBIN"
          "$PGBIN/initdb" --version
          echo "$PGBIN" >> "$GITHUB_PATH"

      # Both of these need a database and neither is in `test` or `test:clean`
      # — check:schema-sync reads one, and test:db is a tier that is easy to
      # miss. Run against the same throwaway rather than folded into
      # test:clean, which is the command people run by hand and should keep
      # meaning what it has always meant.
      - name: Schema sync and database unit tests
        run: |
          bash scripts/test-db.sh sh -c '
            pnpm --filter @workspace/db run check:schema-sync &&
            pnpm --filter @workspace/api-server run test:db
          '

      - name: Integration tests
        # test-db.sh builds a database from empty, migrates it, seeds it,
        # starts the API and throws the lot away afterwards.
        run: pnpm run test:clean

      # The API server runs in the background and its output goes to a file
      # that nothing reads unless it fails to START. A server that starts and
      # then throws on every request — which is what a wall of identical 500s
      # looks like — leaves its only explanation in there, unread.
      - name: API server log
        if: failure()
        run: |
          echo "───── /tmp/api-server-bg.log ─────"
          cat /tmp/api-server-bg.log 2>/dev/null || echo "(no log — the server never started)"
