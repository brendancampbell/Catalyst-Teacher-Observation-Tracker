packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

# Which platform-specific binaries to install.
# 'current' = the machine running `pnpm install`; 'linux'/'x64' keeps the
# deploy target covered when building elsewhere. This replaces the previous
# approach of pinning ~79 optional platform packages to '-' , which stripped
# every non-Linux binary and made the repo impossible to build or test on
# macOS/Windows (esbuild, rollup, lightningcss and tailwind-oxide all failed
# to resolve a binary).
supportedArchitectures:
  os: [ current, linux ]
  cpu: [ current, x64 ]

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  brace-expansion@2: '>=2.1.1'
  esbuild: 0.28.1
  fast-uri@3: '>=3.1.2'
  js-cookie: '>=3.0.8'
  lodash: '>=4.18.1'
  micromatch>picomatch: 4.0.4
  path-to-regexp@8: '>=8.4.2'
  picomatch: '>=2.3.2'
  postcss: '>=8.5.15'
  qs: '>=6.15.2'
  yaml: '>=2.9.0'

allowBuilds:
  esbuild: set this to true or false
